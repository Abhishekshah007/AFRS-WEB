# Browser tests — slower; runs on main pushes and manual trigger (not every PR).
name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afrs_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afrs_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_OPTIONS: --no-deprecation
      PAYLOAD_SECRET: e2e-payload-secret-at-least-32-characters-long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afrs_e2e
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: e2e-cloud
      CLOUDINARY_API_KEY: e2e-key
      CLOUDINARY_API_SECRET: e2e-secret
      RESEND_API_KEY: re_e2e_dummy_key_for_tests_only
      RESEND_FROM_EMAIL: E2E <e2e@example.com>
      SUBMISSION_NOTIFY_EMAIL: e2e@example.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm payload migrate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
