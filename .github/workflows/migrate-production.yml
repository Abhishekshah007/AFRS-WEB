# Run Payload migrations against PRODUCTION — manual only, never on every push.
# Store secrets in GitHub → Settings → Environments → production (recommended).
name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type migrate to run (uses production DATABASE_URL)'
        required: true
        type: string

jobs:
  migrate:
    if: github.event.inputs.confirm == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm payload migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
