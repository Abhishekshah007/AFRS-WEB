version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      payload:
        patterns:
          - '@payloadcms/*'
          - payload
      next:
        patterns:
          - next
          - eslint-config-next
